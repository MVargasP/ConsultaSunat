{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta SUNAT - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <div id="app">
        <!-- Login Section -->
        <section id="login-section" class="fade-in">
            <div class="glass-card login-card">
                <div class="header">
                    <div class="logo-container">
                        <div class="logo-icon">SUNAT</div>
                    </div>
                    <h1>Bienvenido</h1>
                    <p>Ingresa tus credenciales para continuar</p>
                </div>
                <form id="login-form">
                    <div class="input-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" placeholder="Tu nombre de usuario" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" id="login-btn" class="primary-btn">
                        <span>Iniciar Sesión</span>
                        <div class="loader-inner" style="display: none;"></div>
                    </button>
                    <div id="login-error" class="error-msg"></div>
                </form>
            </div>
        </section>

        <!-- Dashboard Section -->
        <section id="dashboard-section" class="fade-in" style="display: none;">
            <header class="main-header">
                <div class="nav-container">
                    <span class="logo-text">Consulta SUNAT</span>
                    <div class="user-menu">
                        <span id="display-name">Usuario</span>
                        <button id="logout-btn" class="secondary-btn">Cerrar Sesión</button>
                    </div>
                </div>
            </header>
            <main class="dashboard-content">
                <div class="stats-grid">
                    <div class="glass-card stat-card">
                        <div class="stat-icon sunat-gradient">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <line x1="10" y1="9" x2="8" y2="9"></line>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <h3>Total Consultas SUNAT</h3>
                            <div class="stat-value" id="total-sunat">0</div>
                            <p class="stat-label">Peticiones realizadas hasta ahora</p>
                        </div>
                    </div>
                </div>
            </main>
        </section>
    </div>
    <script src="{% static 'js/app.js' %}"></script>
</body>

</html>
